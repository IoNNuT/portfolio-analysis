name: Weekly Portfolio Analysis

on:
  schedule:
    - cron: "0 2 * * 1"   # Every Monday 02:00 UTC = 05:00 Bucharest (summer), report ready by 08:00
  workflow_dispatch:        # Manual trigger from GitHub Actions tab

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # allow committing the recommendation memory snapshot

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests feedparser imap-tools

      # Restore the SQLite article cache from previous runs
      - name: Restore article cache
        uses: actions/cache@v4
        with:
          path: seen_articles.db
          key: article-cache-${{ runner.os }}
          restore-keys: article-cache-

      - name: Run portfolio analysis
        env:
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER:          ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD:  ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL:     ${{ secrets.RECIPIENT_EMAIL }}
          DASHBOARD_URL:       ${{ secrets.DASHBOARD_URL }}
          ICLOUD_EMAIL:        ${{ secrets.ICLOUD_EMAIL }}
          ICLOUD_APP_PASSWORD: ${{ secrets.ICLOUD_APP_PASSWORD }}
        run: python portfolio_analysis.py

      # Save the updated cache so next run knows which articles were already seen
      - name: Save article cache
        uses: actions/cache@v4
        with:
          path: seen_articles.db
          key: article-cache-${{ runner.os }}-${{ github.run_id }}

      # Durably persist the recommendation memory in the repo so it survives an
      # Actions cache eviction (which would otherwise wipe the ledger).
      - name: Persist recommendation memory
        if: always()
        run: |
          if [[ -n "$(git status --porcelain recommendations_memory.json)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add recommendations_memory.json
            git commit -m "chore: update recommendation memory snapshot [skip ci]"
            git push
          else
            echo "No recommendation memory changes to commit"
          fi

      - name: Upload HTML report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-analysis-${{ github.run_id }}
          path: portfolio-analysis-*.html
          retention-days: 90
